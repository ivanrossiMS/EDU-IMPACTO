<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Reconectando — Impacto Edu</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100dvh;
      background: radial-gradient(circle at 50% 20%, #152248 0%, #0A0F24 70%);
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      max-width: 380px;
      width: 100%;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(59, 130, 246, 0.25);
      border-radius: 24px;
      padding: 32px 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }
    .pulse-ring {
      width: 68px;
      height: 68px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: rgba(59, 130, 246, 0.14);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .pulse-ring::after {
      content: "";
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      border: 2px solid rgba(59, 130, 246, 0.45);
      animation: pulse 2s infinite ease-out;
    }
    @keyframes pulse {
      0% { transform: scale(0.92); opacity: 0.9; }
      100% { transform: scale(1.25); opacity: 0; }
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(96, 165, 250, 0.25);
      border-top-color: #60A5FA;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 10px;
      color: #FFFFFF;
    }
    p {
      font-size: 0.9rem;
      line-height: 1.5;
      color: #94A3B8;
      margin-bottom: 22px;
    }
    .status {
      font-size: 0.8rem;
      color: #60A5FA;
      margin-bottom: 20px;
      font-weight: 500;
    }
    button {
      width: 100%;
      padding: 14px 20px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #2563EB 0%, #1D4ED8 100%);
      color: #FFFFFF;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    button:active {
      transform: scale(0.98);
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="pulse-ring">
      <div class="spinner"></div>
    </div>
    <h1>Reconectando ao Impacto Edu</h1>
    <p>Detectamos uma oscilação momentânea na sua conexão de rede (4G / Wi-Fi). Assim que o sinal estabilizar, o aplicativo abrirá automaticamente.</p>
    <div id="statusText" class="status">Verificando conexão automaticamente...</div>
    <button id="retryBtn" type="button" onclick="tryReconnect(true)">Reconectar Agora</button>
  </div>

  <script>
    var TARGET_URL = "https://impacto-edu.net/";
    var isChecking = false;
    var attempt = 0;

    function tryReconnect(manual) {
      if (isChecking && !manual) return;
      isChecking = true;
      attempt++;
      var statusEl = document.getElementById("statusText");
      var btnEl = document.getElementById("retryBtn");
      if (statusEl) {
        statusEl.textContent = manual
          ? "Conectando ao servidor..."
          : "Tentando reconexão automática (" + attempt + ")...";
      }
      if (btnEl && manual) {
        btnEl.textContent = "Conectando...";
      }

      var controller = typeof AbortController !== "undefined" ? new AbortController() : null;
      var timeoutId = setTimeout(function () {
        if (controller) controller.abort();
      }, 4500);

      var isSameOrigin = typeof window !== "undefined" && window.location && window.location.origin.indexOf("impacto-edu.net") !== -1;
      fetch(TARGET_URL + "manifest.webmanifest?_t=" + Date.now(), {
        mode: isSameOrigin ? "same-origin" : "no-cors",
        cache: "no-store",
        signal: controller ? controller.signal : undefined
      })
        .then(function (res) {
          clearTimeout(timeoutId);
          if (isSameOrigin && (!res || !res.ok)) {
            throw new Error("HTTP " + (res ? res.status : "error"));
          }
          try {
            var lastRedir = Number(sessionStorage.getItem("edu_offline_last_redirect") || "0");
            if (!manual && Date.now() - lastRedir < 8000) {
              isChecking = false;
              return;
            }
            sessionStorage.setItem("edu_offline_last_redirect", String(Date.now()));
          } catch (e) {}
          if (statusEl) statusEl.textContent = "Conexão restabelecida! Abrindo...";
          window.location.replace(TARGET_URL);
        })
        .catch(function () {
          clearTimeout(timeoutId);
          isChecking = false;
          if (btnEl) btnEl.textContent = "Reconectar Agora";
          if (statusEl) {
            statusEl.textContent = "Aguardando estabilização do sinal 4G/Wi-Fi...";
          }
        });
    }

    setInterval(function () {
      tryReconnect(false);
    }, 3000);

    window.addEventListener("online", function () {
      tryReconnect(true);
    });

    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "visible") {
        tryReconnect(true);
      }
    });

    setTimeout(function () {
      tryReconnect(false);
    }, 1200);
  </script>
</body>
</html>
