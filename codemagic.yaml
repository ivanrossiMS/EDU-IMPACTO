workflows:
  android-workflow:
    name: Android Build
    instance_type: mac_mini_m1
    max_build_duration: 120
    environment:
      java: 21
      node: latest
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Sync Capacitor Android
        script: |
          mkdir -p android/app/src/main/assets
          npx cap sync android
      - name: Build Android App (APK)
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk

  ios-simulator-workflow:
    name: iOS Build (Simulador)
    instance_type: mac_mini_m1
    max_build_duration: 120
    environment:
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Sync Capacitor iOS
        script: npx cap sync ios
      - name: Build iOS App (Simulator)
        script: |
          cd ios/App
          xcodebuild build -project App.xcodeproj -scheme App -destination "generic/platform=iOS Simulator" CODE_SIGNING_ALLOWED=NO
    artifacts:
      - ios/App/build/Build/Products/*-iphonesimulator/*.app

  ios-release-workflow:
    name: iOS Release Build (TestFlight / App Store)
    instance_type: mac_mini_m1
    max_build_duration: 120
    integrations:
      app_store_connect: AppStoreKey
    environment:
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Sync Capacitor iOS
        script: npx cap sync ios
      - name: Set up keychain and code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files
          keychain add-certificates
          xcode-project use-profiles --profile "Impacto Edu AppStore"
      - name: Build iOS App (.ipa)
        script: |
          xcode-project build-ipa \
            --project "ios/App/App.xcodeproj" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
