workflows:
  android-release-workflow:
    name: Android Release Build (.aab)
    instance_type: mac_mini_m1
    max_build_duration: 120
    environment:
      groups:
        - supabase_credentials
      java: 21
      node: latest
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Build web app
        script: npm run build
      - name: Sync Capacitor Android
        script: |
          mkdir -p android/app/src/main/assets
          npx cap sync android
      - name: Set up code signing keystore
        script: |
          KEYSTORE_DIR="$CM_BUILD_DIR/android/app"
          mkdir -p "$KEYSTORE_DIR"
          if [ -n "$CM_KEYSTORE" ]; then
            echo "Usando keystore fornecida nas variáveis do Codemagic..."
            echo "$CM_KEYSTORE" | base64 --decode > "$KEYSTORE_DIR/release-key.jks"
          elif [ ! -f "$KEYSTORE_DIR/release-key.jks" ]; then
            echo "Gerando nova chave de release..."
            keytool -genkeypair \
              -v \
              -keystore "$KEYSTORE_DIR/release-key.jks" \
              -alias "${CM_KEY_ALIAS:-impacto-edu}" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "${CM_KEYSTORE_PASSWORD:-ImpactoEdu2026!}" \
              -keypass "${CM_KEY_PASSWORD:-ImpactoEdu2026!}" \
              -dname "CN=Impacto Edu, OU=Mobile, O=Impacto Edu, C=BR"
          fi
          echo "CM_KEYSTORE_PATH=$KEYSTORE_DIR/release-key.jks" >> $CM_ENV
          echo "CM_KEYSTORE_PASSWORD=${CM_KEYSTORE_PASSWORD:-ImpactoEdu2026!}" >> $CM_ENV
          echo "CM_KEY_ALIAS=${CM_KEY_ALIAS:-impacto-edu}" >> $CM_ENV
          echo "CM_KEY_PASSWORD=${CM_KEY_PASSWORD:-ImpactoEdu2026!}" >> $CM_ENV
      - name: Build Android App Bundle (.aab)
        script: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/apk/release/*.apk
      - android/app/release-key.jks

  ios-simulator-workflow:
    name: iOS Build (Simulador)
    instance_type: mac_mini_m1
    max_build_duration: 120
    environment:
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Sync Capacitor iOS
        script: npx cap sync ios
      - name: Build iOS App (Simulator)
        script: |
          cd ios/App
          xcodebuild build -project App.xcodeproj -scheme App -destination "generic/platform=iOS Simulator" CODE_SIGNING_ALLOWED=NO
    artifacts:
      - ios/App/build/Build/Products/*-iphonesimulator/*.app

  ios-release-workflow:
    name: iOS Release Build (TestFlight / App Store)
    instance_type: mac_mini_m1
    max_build_duration: 120
    integrations:
      app_store_connect: AppStoreAdminKey
    environment:
      groups:
        - supabase_credentials
      ios_signing:
        distribution_type: app_store
        bundle_identifier: br.com.impactoedu.agenda
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Validate Supabase environment
        script: |
          : "${SUPABASE_URL:?SUPABASE_URL não configurada}"
          : "${SUPABASE_PUBLISHABLE_KEY:?SUPABASE_PUBLISHABLE_KEY não configurada}"
          : "${SUPABASE_SECRET_KEY:?SUPABASE_SECRET_KEY não configurada}"
          : "${SUPABASE_JWKS_URL:?SUPABASE_JWKS_URL não configurada}"
      - name: Build web app
        script: npm run build
      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios
      - name: Auto-increment iOS Build Number from TestFlight
        script: |
          LATEST_BUILD=$(app-store-connect get-latest-testflight-build-number --bundle-id "br.com.impactoedu.agenda" 2>/dev/null || echo "0")
          if [ -z "$LATEST_BUILD" ] || [ "$LATEST_BUILD" -eq 0 ] 2>/dev/null; then
            LATEST_BUILD=${BUILD_NUMBER:-1}
          fi
          NEW_BUILD=$((LATEST_BUILD + 1))
          echo "=========================================="
          echo "Ultimo Build Number no TestFlight: $LATEST_BUILD"
          echo "Novo Build Number a aplicar: $NEW_BUILD"
          echo "=========================================="
          cd ios/App
          agvtool new-version -all $NEW_BUILD || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $NEW_BUILD" App/Info.plist || true
      - name: Check provisioning profile
        script: |
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"

          for PROFILE in "$PROFILE_DIR"/*.mobileprovision; do
            [ -e "$PROFILE" ] || continue

            echo "=============================="
            echo "PROFILE FILE: $PROFILE"

            security cms -D -i "$PROFILE" > /tmp/profile.plist

            echo "NAME:"
            /usr/libexec/PlistBuddy -c "Print :Name" /tmp/profile.plist || true

            echo "APP ID:"
            /usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" /tmp/profile.plist || true

            echo "APS ENVIRONMENT:"
            /usr/libexec/PlistBuddy -c "Print :Entitlements:aps-environment" /tmp/profile.plist || true
          done
      - name: Apply iOS signing profile
        script: |
          xcode-project use-profiles \
            --project "$CM_BUILD_DIR/ios/App/App.xcodeproj"
      - name: Build iOS App (.ipa)
        script: |
          set -x

          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/ios/App/App.xcodeproj" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
      - ios/App/build/**/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
