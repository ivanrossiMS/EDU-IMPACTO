workflows:
  android-workflow:
    name: Android Build
    instance_type: mac_mini_m1
    max_build_duration: 120
    environment:
      java: 21
      node: latest
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Sync Capacitor Android
        script: |
          mkdir -p android/app/src/main/assets
          npx cap sync android
      - name: Build Android App (APK)
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk

  ios-simulator-workflow:
    name: iOS Build (Simulador)
    instance_type: mac_mini_m1
    max_build_duration: 120
    environment:
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Sync Capacitor iOS
        script: npx cap sync ios
      - name: Build iOS App (Simulator)
        script: |
          cd ios/App
          xcodebuild build -project App.xcodeproj -scheme App -destination "generic/platform=iOS Simulator" CODE_SIGNING_ALLOWED=NO
    artifacts:
      - ios/App/build/Build/Products/*-iphonesimulator/*.app

  ios-release-workflow:
    name: iOS Release Build (TestFlight / App Store)
    instance_type: mac_mini_m1
    max_build_duration: 120
    integrations:
      app_store_connect: AppStoreAdminKey
    environment:
      groups:
        - supabase_credentials
      ios_signing:
        distribution_type: app_store
        bundle_identifier: br.com.impactoedu.agenda
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Validate Supabase environment
        script: |
          : "${SUPABASE_URL:?SUPABASE_URL não configurada}"
          : "${SUPABASE_PUBLISHABLE_KEY:?SUPABASE_PUBLISHABLE_KEY não configurada}"
          : "${SUPABASE_SECRET_KEY:?SUPABASE_SECRET_KEY não configurada}"
          : "${SUPABASE_JWKS_URL:?SUPABASE_JWKS_URL não configurada}"
      - name: Build web app
        script: npm run build
      - name: Sync Capacitor iOS
        script: npx cap sync ios
      - name: Install CocoaPods
        script: |
          cd ios/App
          [ -f Podfile ] && pod install || echo "Sem Podfile, utilizando Swift Package Manager (CapApp-SPM)."
      - name: Diagnostic & Apply iOS signing profiles
        script: |
          echo "=== Certificados de assinatura no Keychain ==="
          security find-identity -v -p codesigning || true
          echo "=== Provisioning profiles baixados ==="
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          ls -la "$PROFILE_DIR" || true
          for PROFILE_PATH in "$PROFILE_DIR"/*.mobileprovision; do
            [ -e "$PROFILE_PATH" ] || continue
            echo "Profile: $PROFILE_PATH"
            security cms -D -i "$PROFILE_PATH" | plutil -extract Name raw -o - - || true
            security cms -D -i "$PROFILE_PATH" | plutil -extract TeamIdentifier.0 raw -o - - || true
            security cms -D -i "$PROFILE_PATH" | plutil -extract Entitlements.application-identifier raw -o - - || true
          done
          xcode-project use-profiles --project "ios/App/App.xcodeproj"
      - name: Build iOS App (.ipa)
        script: |
          if [ -d "ios/App/App.xcworkspace" ]; then
            xcode-project build-ipa \
              --workspace "$CM_BUILD_DIR/ios/App/App.xcworkspace" \
              --scheme "App" \
              --config Release
          else
            xcode-project build-ipa \
              --project "ios/App/App.xcodeproj" \
              --scheme "App" \
              --config Release
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
